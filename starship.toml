palette = "catppuccin_macchiato"
format = """
[](#9A348E)\
$os\
[](bg:#DA627D fg:#9A348E)\
$directory\
[](fg:#DA627D bg:#FCA17D)\
$git_branch\
$git_status\
[](fg:#FCA17D bg:#86BBD8)\
$golang\
$python\
$nodejs\
$nim\
[](fg:#86BBD8 bg:#06969A)\
[](fg:#06969A bg:#33658A)\
$time\
[ ](fg:#33658A)\
$direnv\
"""
right_format = """
 \
$aws\
[   ](fg:white)\
$azure\
[  ](fg:white)\
$kubernetes\
$cmd_duration\
"""
# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:white"
style_root = "bg:#9A348E"
format = '[$user ]($style)'
disabled = false

[cmd_duration]
min_time = 500
format = ' [$duration](#6272a4)'
disabled = false


[kubernetes]
symbol = " ⎈ "
format = "[ $symbol$context( \\($namespace\\)) ]($style)"
style = "italic fg:mauve"
disabled = false


# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "fg:sand bg:#9A348E"
disabled = false # Disabled by default

[directory]
read_only = " 󰌾"
style = "bg:#DA627D"
format = "[ $path ]($style)"
truncation_length = 5
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"projects" = "🦄"
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[docker_context]
symbol = " "
style = "bg:#06969A"
format = '[ $symbol $context ]($style)'

[git_branch]
symbol = ""
style = "bg:#FCA17D"
#style = "bg:#8caddb"
format = '[ $symbol $branch ]($style)'

[git_status]
#style = "bg:#8caddb"
style = "bg:#FCA17D"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'
detect_extensions = ['js', 'mjs', 'cjs', 'ts', 'mts', 'cts']

[python]
symbol = " "
pyenv_version_name = true

[nim]
symbol = "󰆥 "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#33658A"
format = '[ ♥ $time ]($style)'

[azure]
disabled = false
format = '[$symbol($subscription) ]($style)'
symbol = '󰠅 '
style = 'fg:sky'

[direnv]
disabled = false


[aws]
format = '[$symbol($profile )(\($region\) )(\[$duration\] )]($style)'
disabled = false
symbol = "  "
style =  "fg:yellow"


[guix_shell]
symbol = " "

[hostname]
ssh_symbol = " "


[lua]
symbol = " "

[memory_usage]
symbol = "󰍛 "

[nix_shell]
symbol = " "

[os.symbols]
Amazon = " "
Debian = " "
Linux = " "
Macos = " "
# "⭐️ "
# "" " 
#" "
Ubuntu = " "
Windows = "󰍲 "

[package]
symbol = "󰏗 "

